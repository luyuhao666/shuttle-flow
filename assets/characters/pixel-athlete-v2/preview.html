<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; object-src 'none'">
<title>Shuttle Flow · 3D 角色与动作</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#1e3440;background:#e9ece9}body{display:grid;grid-template-columns:minmax(0,1fr) 280px;overflow:hidden}main{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}.caption{position:absolute;top:26px;left:28px;pointer-events:none}.caption h1{font-size:26px;margin:0 0 7px}.caption p{font-size:15px;margin:0;color:#5d7373}aside{background:#f7f8f4;border-left:1px solid #ccd5cf;padding:25px 20px;overflow:auto}h2{font-size:17px;margin:0 0 13px}.section{margin-bottom:24px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{font:inherit;font-size:15px;min-height:43px;padding:9px;border:1px solid #c5d2cd;border-radius:8px;background:#e9efeb;color:#24464b;cursor:pointer}button[aria-pressed=true]{background:#c1dbe2;border-color:#6395a1}label{display:flex;align-items:center;gap:9px;font-size:15px;margin:14px 0}input{accent-color:#296fc4}input[type=checkbox]{width:18px;height:18px}select{font:inherit;width:100%;padding:9px;border:1px solid #c5d2cd;border-radius:6px;background:#fff}.note{font-size:14px;line-height:1.7;color:#5d7373}.download{display:block;text-align:center;background:#265b72;color:white;padding:12px;text-decoration:none;border-radius:8px;font-size:15px}#loading{position:absolute;inset:0;display:grid;place-content:center;font-size:18px}#loading[hidden]{display:none}button:focus-visible,a:focus-visible{outline:3px solid #fc8227;outline-offset:3px}@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:minmax(340px,1fr) auto}aside{max-height:39vh;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:15px;border-left:0;border-top:1px solid #ccd5cf}.section{margin:0}.caption{top:17px;left:18px}.caption h1{font-size:22px}}
</style></head>
<body>
<main><canvas id="viewport" aria-label="可旋转的像素风三维运动员"></canvas><img id="court-preview" src="court-preview.png" alt="现有球场中的角色外观比较截图" hidden style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0e3034"><div class="caption"><h1>Shuttle Flow</h1><p id="caption-note">像素风 3D 运动员 · 外观预览</p></div><div id="loading">正在载入角色…</div></main>
<aside>
<section class="section"><h2>动作预览</h2><div class="buttons" id="animations"></div><div class="buttons" style="margin-top:10px"><button id="pause" aria-pressed="false">暂停</button><button id="replay">重新播放</button><button id="previous-frame">上一帧</button><button id="next-frame">下一帧</button></div><label><input type="checkbox" id="loop" checked>循环播放</label><select id="speed" aria-label="动作播放速度"><option value=".25">0.25 倍慢放</option><option value=".5">0.5 倍慢放</option><option value="1" selected>正常速度</option><option value="1.5">1.5 倍速度</option></select><input id="timeline" type="range" min="0" max="1" step=".001" value="0" aria-label="动作进度" style="width:100%;margin-top:12px"><p class="note" id="motion-time">0.00 秒</p><p class="note" id="motion-note">弓腰屈膝候球，持拍手保持准备姿态。</p></section>
<section class="section"><h2>查看角色</h2><div class="buttons"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="three-quarter" aria-pressed="true">斜侧</button><button data-view="face" style="grid-column:1/-1">面部细节</button></div><label><input type="checkbox" id="rotate">自动旋转</label><div class="buttons"><button id="reset">恢复视角</button><button id="court-toggle" aria-pressed="false">球场效果</button></div><p class="note">拖动旋转 · 滚轮缩放<br>触屏可双指缩放</p></section>
<section class="section"><h2>显示效果</h2><select id="pixels" aria-label="角色显示精度"><option value="1" selected>清晰查看模型</option><option value="2">像素风 · 2 像素</option><option value="3">像素风 · 3 像素</option></select><label><input type="checkbox" id="racket" checked>显示球拍</label><label><input type="checkbox" id="skeleton">显示骨骼</label><p class="note">蓝色球衣 · 橙色头带 · 7 号<br>可慢放或逐帧检查脚步与挥拍。</p></section>
<section class="section"><a class="download" id="download" href="athlete.glb" download="shuttle-flow-pixel-athlete-v2.glb">保存 3D 模型</a><p class="note">球拍为独立部件，后续可单独替换。当前预览不会修改游戏。</p></section>
</aside><script src="preview.js"></script></body></html>
